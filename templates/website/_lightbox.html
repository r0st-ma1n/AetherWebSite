{% load i18n %}
<dialog id="lightbox" class="w-full max-w-6xl bg-transparent p-4 text-slate-200 backdrop:bg-black/85">
    <form method="dialog" class="flex justify-end mb-2">
        <button class="rounded-lg p-2 text-slate-300 hover:text-white hover:bg-white/10" aria-label="{% trans "Закрыть" %}">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
    </form>
    <figure>
        <img class="w-full max-h-[80vh] object-contain rounded-lg" alt="">
        <figcaption class="mt-3 text-sm text-slate-400"></figcaption>
    </figure>
</dialog>
